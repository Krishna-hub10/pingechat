
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PingMe - Private Chat</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="app">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="logo">Ping<span>Me</span><b>.</b></div>

      <div class="profile">
        <div class="avatar">M</div>
        <div>
          <h3 id="myName">My Account</h3>
          <p>My username</p>
        </div>
        <span class="online-dot"></span>
      </div>

      <div class="search-box">
        <input type="text" id="searchUser"
          placeholder="Search username...">
      </div>

      <h4 class="section-title">MESSAGES</h4>

      <div class="user-list" id="userList">
        <p class="empty">No users yet</p>
      </div>

      <div class="sidebar-bottom">
        <button id="logoutBtn">↪ Logout</button>
      </div>
    </aside>

    <!-- Main Chat -->
    <main class="chat-area">

      <div class="welcome" id="welcome">
        <div class="welcome-icon">✦</div>
        <h1>Welcome to <span>PingMe</span></h1>
        <p>Connect privately. Chat freely.</p>
        <p class="hint">Choose a username from the sidebar to start chatting.</p>
      </div>

      <section class="chat-screen hidden" id="chatScreen">

        <header class="chat-header">
          <div class="avatar" id="chatAvatar">U</div>
          <div>
            <h3 id="chatName">Username</h3>
            <p id="chatStatus">Offline</p>
          </div>
        </header>

        <div class="messages" id="messages">
        </div>

        <form class="message-form" id="messageForm">
          <input type="text" id="messageInput"
            placeholder="Write a message..." autocomplete="off">
          <button type="submit">➤</button>
        </form>

      </section>
    </main>
  </div>

  <!-- Login / Registration -->
  <div class="auth-overlay" id="authOverlay">
    <div class="auth-card">
      <div class="logo">Ping<span>Me</span><b>.</b></div>
      <h2 id="authTitle">Create Account</h2>
      <p class="auth-subtitle">Your private space to connect.</p>

      <form id="authForm">
        <input id="nameInput" type="text"
          placeholder="Full name" required>

        <input id="usernameInput" type="text"
          placeholder="Choose username" required>

        <input id="emailInput" type="email"
          placeholder="Email address" required>

        <input id="passwordInput" type="password"
          placeholder="Password" required>

        <button type="submit" id="authButton">Create Account</button>
      </form>

      <p class="switch-auth" id="switchAuth">
        Already have an account? <span>Login</span>
      </p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
